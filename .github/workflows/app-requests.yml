name: Pedidos de la app

# VibeM3U 0.5.90+: «Enviar a la papelera» desde la TV deja un JSON en data/app-requests/.
# Aquí se aplica con las mismas funciones del editor web, se borra el pedido y se relanzan la
# actualización de canales y de enlaces (un push con GITHUB_TOKEN no dispara otros workflows).
on:
  push:
    branches:
      - main
    paths:
      - "data/app-requests/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: m3u-app-requests
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/app-requests.test.mjs tests/editor-core.test.mjs
      - name: Aplicar y publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            summary=$(node scripts/apply_app_requests.mjs | tail -n 1)
            echo "$summary"
            git add -A data/app-requests data/channel-editor-layout.json data/vibem3u-selection.json presentation-overrides.json
            if git diff --cached --quiet; then echo "Sin pedidos pendientes"; echo "APPLIED=0" >> "$GITHUB_ENV"; exit 0; fi
            names=$(node -e 'const s=JSON.parse(process.argv[1]);console.log(s.applied.map(a=>a.name).join(", ")||"pedidos inválidos")' "$summary")
            applied=$(node -e 'console.log(JSON.parse(process.argv[1]).applied.length)' "$summary")
            git commit -q -m "Papelera desde la app: $names"
            if git push; then echo "APPLIED=$applied" >> "$GITHUB_ENV"; exit 0; fi
            # Otro cambio llegó antes: se parte de lo publicado y se vuelve a aplicar.
            git fetch origin main
            git reset -q --hard origin/main
          done
          exit 1
      - name: Actualizar canales y enlaces
        if: env.APPLIED != '0'
        run: |
          gh workflow run update-channels.yml --ref main
          gh workflow run update-highfly.yml --ref main
