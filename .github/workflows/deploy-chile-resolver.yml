name: Deploy Chile resolver

on:
  workflow_dispatch:
  push:
    paths:
      - "cloud-resolver/**"
      - ".github/workflows/deploy-chile-resolver.yml"

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: vibem3u-chile-resolver
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'rugged-episode-148820' }}
      GCP_REGION: southamerica-west1
      SERVICE_NAME: vibem3u-chile-resolver
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Preparar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Desplegar en Santiago
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --source cloud-resolver \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --memory=256Mi \
            --cpu=1 \
            --concurrency=20 \
            --timeout=30 \
            --quiet
          resolver_url="$(gcloud run services describe "$SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.url)')"
          test -n "$resolver_url"
          echo "resolver_url=$resolver_url" >> "$GITHUB_OUTPUT"

      - name: Guardar URL del resolutor como variable del repositorio
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh variable set M3U_RESOLVER_BASE_URL \
            --repo "$GITHUB_REPOSITORY" \
            --body "${{ steps.deploy.outputs.resolver_url }}"

      - name: Conectar la M3U al resolutor
        env:
          M3U_RESOLVER_BASE_URL: ${{ steps.deploy.outputs.resolver_url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import update_m3u

          playlist = Path("m3u.m3u")
          lines = playlist.read_text(encoding="utf-8-sig").splitlines()
          if update_m3u.pin_cloud_resolver_channels(lines):
              playlist.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY
          if grep -R "192\.168\.0\.165\|127\.0\.0\.1" m3u.m3u; then
            echo "La M3U conserva una direccion local" >&2
            exit 1
          fi

      - name: Publicar URL cloud en la rama principal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VibeM3U Cloud Deploy"
          git config user.email "m3u-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- m3u.m3u)" ]; then
            echo "La M3U ya usa el resolutor cloud."
            exit 0
          fi
          git add m3u.m3u
          git commit -m "Conecta resolutor Chile de Cloud Run [skip ci]"
          git push origin HEAD:main
