name: Actualizar M3U y EPG

on:
  schedule:
    # Dos ventanas locales: 00:00 y 12:00 de Santiago. GitHub puede iniciar
    # algunos minutos despues porque los cron programados son best effort.
    - cron: "0 0,12 * * *"
      timezone: "America/Santiago"
  workflow_dispatch:
    inputs:
      force_run:
        description: Ejecutar aunque no hayan vencido las 12 horas
        required: false
        default: false
        type: boolean
      force_epg_refresh:
        description: Forzar la descarga de la guia EPG
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

concurrency:
  group: m3u-publisher
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[test m3u]')
    runs-on: ubuntu-latest
    env:
      RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probar importadores EPG
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Ejecutar coordinador con ventana de 12 horas
        id: updater
        shell: bash
        run: |
          args=(run_m3u_48h.py --executor github)
          if [ "${{ inputs.force_run }}" = "true" ]; then
            args+=(--force)
          fi
          if [ "${{ inputs.force_epg_refresh }}" = "true" ]; then
            args+=(--force-epg)
          fi
          set +e
          python "${args[@]}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar cambios
        id: publish
        if: steps.updater.outputs.status == '0' && steps.updater.outputs.ran == 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- m3u.m3u channel-catalog.m3u epg.xml resolver-catalog.json channel-health-state.json run-state.json)" ]; then
            echo "La lista, la guia, la salud y el catalogo de resolutores ya estaban al dia."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "Actualizador M3U"
          git config user.email "m3u-bot@users.noreply.github.com"
          git add m3u.m3u channel-catalog.m3u epg.xml resolver-catalog.json channel-health-state.json run-state.json
          git commit -m "Actualiza M3U, EPG y resolutores automaticamente [skip ci]"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Conservar historial de salud si la publicación fue bloqueada
        id: health_state
        if: steps.updater.outputs.due == 'true' && steps.updater.outputs.status != '0'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- channel-health-state.json)" ]; then
            echo "El historial de salud no cambió."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "Actualizador M3U"
          git config user.email "m3u-bot@users.noreply.github.com"
          git add channel-health-state.json
          git commit -m "Registra fallos de canales sin publicar la lista [skip ci]"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Esperar propagacion de GitHub raw
        if: steps.updater.outputs.ran == 'true' && steps.publish.outputs.changed == 'true'
        run: sleep 15

      - name: Verificar contenido exacto del commit publicado
        id: published
        if: steps.updater.outputs.ran == 'true'
        shell: bash
        run: |
          set +e
          RAW_EXIT=0
          RAW_COMMIT="${{ steps.publish.outputs.commit }}"
          if [ -z "$RAW_COMMIT" ]; then
            RAW_COMMIT="$GITHUB_SHA"
          fi
          RAW_COMMIT_BASE="https://raw.githubusercontent.com/${{ github.repository }}/$RAW_COMMIT"
          verify_exact() {
            local file="$1"
            local attempts=0
            while [ "$attempts" -lt 5 ]; do
              attempts=$((attempts + 1))
              temporary="$(mktemp)"
              if curl --fail --silent --show-error --location --max-time 30 \
                --retry 3 --retry-delay 2 \
                "$RAW_COMMIT_BASE/$file?verify=$GITHUB_RUN_ID-$attempts" \
                --output "$temporary" \
                && cmp --silent "$temporary" "$file"; then
                echo "$file publicado con contenido exacto"
                rm -f "$temporary"
                return 0
              fi
              rm -f "$temporary"
              sleep 2
            done
            echo "$file no coincide con el commit publicado" >&2
            return 1
          }
          verify_exact m3u.m3u || RAW_EXIT=1
          verify_exact channel-catalog.m3u || RAW_EXIT=1
          verify_exact epg.xml || RAW_EXIT=1
          verify_exact resolver-catalog.json || RAW_EXIT=1
          verify_exact channel-health-state.json || RAW_EXIT=1
          echo "status=$RAW_EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comprobar URLs raw publicas de main
        id: branch_raw
        if: steps.updater.outputs.ran == 'true'
        shell: bash
        run: |
          set +e
          RAW_EXIT=0
          check_raw() {
            local file="$1"
            local marker="$2"
            local attempts=0
            while [ "$attempts" -lt 6 ]; do
              attempts=$((attempts + 1))
              if body="$(curl --fail --silent --show-error --location --max-time 30 "$RAW_BASE/$file?health=$GITHUB_RUN_ID-$attempts")" \
                && [[ "$body" == *"$marker"* ]]; then
                echo "$file accesible en raw/main"
                return 0
              fi
              sleep 5
            done
            echo "$file no respondio con el formato esperado" >&2
            return 1
          }
          check_raw m3u.m3u '#EXTM3U' || RAW_EXIT=1
          check_raw channel-catalog.m3u '#EXTM3U' || RAW_EXIT=1
          check_raw epg.xml '<?xml' || RAW_EXIT=1
          check_raw resolver-catalog.json '"schemaVersion": 1' || RAW_EXIT=1
          check_raw channel-health-state.json '"schema": 1' || RAW_EXIT=1
          echo "status=$RAW_EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Informar ventana no vencida
        if: steps.updater.outputs.status == '0' && steps.updater.outputs.ran != 'true'
        run: echo "No se ejecuta el flujo completo; aun no ha llegado la ventana dinamica o la ventana pertenece al otro ejecutor."

      - name: Generar informe detallado
        if: always() && steps.updater.outputs.due == 'true'
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPDATE_STATUS: ${{ steps.updater.outputs.status }}
          PUBLICATION_STATUS: ${{ steps.publish.outcome }}
          RAW_STATUS: commit=${{ steps.published.outputs.status }}, main=${{ steps.branch_raw.outputs.status }}
        shell: bash
        run: |
          python generate_health_report.py
          cat health-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Notificar informe en GitHub
        if: always() && steps.updater.outputs.due == 'true' && hashFiles('health-report.md') != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORT_PATH: health-report.md
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Estado automático de Lista M3U';
            const label = 'm3u-health-report';
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8').slice(0, 65000);
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: '1f6feb',
                description: 'Informes automáticos de canales, EPG y publicación'
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            const listed = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 100
            });
            const issue = listed.data.find(item => !item.pull_request && item.title === title);
            if (issue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body
              });
              core.info(`Informe agregado a #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [label]
              });
              core.info(`Informe creado en #${created.data.number}`);
            }

      - name: Guardar informe de canales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-status
          path: |
            channel-status.json
            health-report.md
          retention-days: 30
          if-no-files-found: warn

      - name: Fallar si hubo errores
        if: steps.updater.outputs.status != '0' || (steps.updater.outputs.ran == 'true' && (steps.published.outputs.status != '0' || steps.branch_raw.outputs.status != '0'))
        run: exit 1
