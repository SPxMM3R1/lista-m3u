name: Actualizar M3U y EPG

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force_epg_refresh:
        description: Forzar la descarga de la guia EPG
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: m3u-publisher
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[test m3u]')
    runs-on: ubuntu-latest
    env:
      RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar actualizador
        id: updater
        shell: bash
        run: |
          if [ "${{ inputs.force_epg_refresh }}" = "true" ]; then
            export EPG_FORCE_REFRESH=true
          fi
          set +e
          python update_m3u.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar cambios
        id: publish
        if: steps.updater.outputs.status == '0'
        shell: bash
        run: |
          if git diff --quiet -- m3u.m3u epg.xml; then
            echo "La lista y la guia ya estaban al dia."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "Actualizador M3U"
          git config user.email "m3u-bot@users.noreply.github.com"
          git add m3u.m3u epg.xml
          git commit -m "Actualiza M3U y EPG automaticamente [skip ci]"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Esperar propagacion de GitHub raw
        if: steps.publish.outputs.changed == 'true'
        run: sleep 15

      - name: Verificar contenido exacto del commit publicado
        id: published
        shell: bash
        run: |
          set +e
          RAW_EXIT=0
          RAW_COMMIT_BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.publish.outputs.commit }}"
          verify_exact() {
            local file="$1"
            local attempts=0
            while [ "$attempts" -lt 5 ]; do
              attempts=$((attempts + 1))
              temporary="$(mktemp)"
              if curl --fail --silent --show-error --location --max-time 30 \
                --retry 3 --retry-delay 2 \
                "$RAW_COMMIT_BASE/$file?verify=$GITHUB_RUN_ID-$attempts" \
                --output "$temporary" \
                && cmp --silent "$temporary" "$file"; then
                echo "$file publicado con contenido exacto"
                rm -f "$temporary"
                return 0
              fi
              rm -f "$temporary"
              sleep 2
            done
            echo "$file no coincide con el commit publicado" >&2
            return 1
          }
          verify_exact m3u.m3u || RAW_EXIT=1
          verify_exact epg.xml || RAW_EXIT=1
          echo "status=$RAW_EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comprobar URLs raw publicas de main
        id: branch_raw
        shell: bash
        run: |
          set +e
          RAW_EXIT=0
          check_raw() {
            local file="$1"
            local marker="$2"
            local attempts=0
            while [ "$attempts" -lt 6 ]; do
              attempts=$((attempts + 1))
              if body="$(curl --fail --silent --show-error --location --max-time 30 "$RAW_BASE/$file?health=$GITHUB_RUN_ID-$attempts")" \
                && [[ "$body" == *"$marker"* ]]; then
                echo "$file accesible en raw/main"
                return 0
              fi
              sleep 5
            done
            echo "$file no respondio con el formato esperado" >&2
            return 1
          }
          check_raw m3u.m3u '#EXTM3U' || RAW_EXIT=1
          check_raw epg.xml '<?xml' || RAW_EXIT=1
          echo "status=$RAW_EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fallar si hubo errores
        if: steps.updater.outputs.status != '0' || steps.published.outputs.status != '0' || steps.branch_raw.outputs.status != '0'
        run: exit 1

      - name: Guardar informe de canales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-status
          path: channel-status.json
          retention-days: 30
          if-no-files-found: warn
