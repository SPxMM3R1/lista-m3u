name: Actualizar EPG
on:
  schedule:
    - cron: "30 */6 * * *"
      timezone: "America/Santiago"
  workflow_dispatch:
    inputs:
      force:
        description: "Fuerza una descarga inmediata de la EPG sin cambiar la cadencia automática"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: m3u-publisher
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p "test_*.py"
      - name: Ejecutar EPG independiente
        run: |
          if [[ "${{ inputs.force }}" == "true" ]]; then
            python run_epg_6h.py --executor github --force
          else
            python run_epg_6h.py --executor github
          fi
      - run: python publish_epg.py
      - run: sleep 15
