name: Actualizar EPG
# Guía por canal (2026-10-12). Cada 30 min un despachador decide qué fuentes vencieron (cada
# una con su ritmo y reintentos con espera creciente); solo esas se descargan, en jobs
# separados. Cada canal guarda su guía en epg/canales/<id>.xml y solo se reescribe si una de
# sus fuentes se descargó; si su fuente falla conserva su última guía buena. epg.xml se une
# sin red desde los fragmentos y las correcciones de epg/manual/: no puede caerse por una
# fuente. Las pruebas del repo corren en cada push de código, no aquí.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      fuentes:
        description: "Partes a renovar ya, separadas por coma (vacío = solo las vencidas; «todas» = todas). Ej: tvn-oficial,red-bull"
        required: false
        default: ""
        type: string
  workflow_run:
    # Si cambia Lista 1, los canales nuevos piden sus fuentes y la unión respeta el alcance.
    # workflow_run trae el SHA del runner que terminó; los jobs deben leer main actual,
    # no ese snapshot potencialmente obsoleto, para evitar colisiones al publicar EPG.
    workflows:
      - Actualizar canales M3U
    types:
      - completed
    branches:
      - main
  push:
    # Correcciones manuales desde el editor: solo unir, en segundos.
    branches:
      - main
    paths:
      - "epg/manual/**"
permissions:
  contents: write
# Grupo propio: la EPG solo publica epg.xml, epg/, epg-run-state.json y epg-pending.json,
# que canales y cambios dirigidos no tocan. Si otro proceso publica primero,
# publish_epg.py integra main y reintenta.
concurrency:
  group: m3u-epg
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input tzdata
      - name: Elegir fuentes vencidas
        id: plan
        env:
          FUENTES: ${{ inputs.fuentes }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          args=(plan)
          if [ "$FUENTES" = "todas" ]; then args+=(--all); elif [ -n "$FUENTES" ]; then args+=(--force "$FUENTES"); fi
          python epg_dispatch.py "${args[@]}"

  fetch:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    name: fuente ${{ matrix.part }}
    env:
      PYTHONTZPATH: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input tzdata
      - name: Descargar ${{ matrix.part }}
        run: python update_m3u.py --fetch-epg-part "${{ matrix.part }}" --epg-parts-dir epg-parts
      - uses: actions/upload-artifact@v4
        with:
          name: epg-part-${{ matrix.part }}
          path: epg-parts/
          retention-days: 2
          if-no-files-found: error

  update:
    needs: [plan, fetch]
    # Corre aunque falle alguna fuente (o no haya ninguna vencida): une igual.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Use the Python tzdata package so America/Santiago follows DST even if
      # the runner image has an older system timezone database.
      PYTHONTZPATH: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar datos de zona horaria
        run: python -m pip install --disable-pip-version-check --no-input tzdata
      - name: Comprobar zona horaria de Chile
        run: python -c "from datetime import datetime, timezone; from zoneinfo import ZoneInfo; now=datetime.now(timezone.utc).astimezone(ZoneInfo('America/Santiago')); print(now.isoformat()); assert now.utcoffset() is not None"
      - name: Reunir fuentes descargadas
        if: needs.plan.outputs.any == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: epg-part-*
          path: epg-parts
          merge-multiple: true
      - name: Construir por canal y unir
        shell: bash
        run: |
          mkdir -p epg-parts
          if [ "${{ needs.plan.outputs.any }}" = "true" ]; then
            python update_m3u.py --build-epg-fragments --epg-parts-dir epg-parts
            planned='${{ needs.plan.outputs.parts }}'
          else
            python update_m3u.py --assemble-epg
            planned='[]'
          fi
          # Registra cada fuente y deja los avisos de canales con poca guía por delante.
          python epg_dispatch.py record --planned "$planned" --parts-dir epg-parts
      - name: Publicar EPG
        id: publish
        shell: bash
        run: |
          python publish_epg.py
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: sleep 15
      - name: Verificar EPG publicada en GitHub Raw
        env:
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}
        run: python update_m3u.py --verify-epg-published "$RAW_BASE/${{ steps.publish.outputs.commit }}/epg.xml"
