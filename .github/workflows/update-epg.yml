name: Actualizar EPG
on:
  schedule:
    - cron: "30 */6 * * *"
      timezone: "America/Santiago"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m3u-publisher
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar combinador iptv-org/epg
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git "$RUNNER_TEMP/iptv-org-epg"
      - name: Instalar dependencias del combinador
        run: npm ci --no-audit --no-fund
        working-directory: ${{ runner.temp }}/iptv-org-epg
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python run_epg_6h.py --executor github
        env:
          IPTV_ORG_EPG_ROOT: ${{ runner.temp }}/iptv-org-epg
          IPTV_ORG_EPG_GUIDE_PATH: ${{ github.workspace }}/iptv-org-guide.xml
      - run: python publish_epg.py
      - run: sleep 15
