name: Deploy Cloudflare resolver

on:
  workflow_dispatch:
  push:
    paths:
      - "cloudflare-resolver/**"
      - ".github/workflows/deploy-cloudflare-resolver.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: vibem3u-cloudflare-resolver
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WORKER_CONFIG: cloudflare-resolver/wrangler.toml
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar configuracion de Cloudflare
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pendiente: configura CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configuracion cloud pendiente
        if: steps.config.outputs.configured != 'true'
        run: echo "Cloudflare queda pendiente hasta configurar las credenciales del repositorio."

      - name: Publicar Worker
        if: steps.config.outputs.configured == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config "$WORKER_CONFIG" 2>&1 | tee wrangler-deploy.log
          resolver_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' wrangler-deploy.log | tail -1 || true)"
          if [ -z "$resolver_url" ]; then
            echo "No se pudo identificar la URL workers.dev publicada." >&2
            exit 1
          fi
          echo "resolver_url=$resolver_url" >> "$GITHUB_OUTPUT"

      - name: Esperar health del Worker
        if: steps.config.outputs.configured == 'true'
        env:
          RESOLVER_URL: ${{ steps.deploy.outputs.resolver_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if [ "$(curl -fsS "$RESOLVER_URL/health" || true)" = "ok" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "El health del Worker no respondio a tiempo." >&2
          exit 1

      - name: Guardar URL del resolutor como variable del repositorio
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh variable set M3U_RESOLVER_BASE_URL \
            --repo "$GITHUB_REPOSITORY" \
            --body "${{ steps.deploy.outputs.resolver_url }}"

      - name: Conectar la M3U al resolutor
        if: steps.config.outputs.configured == 'true'
        env:
          M3U_RESOLVER_BASE_URL: ${{ steps.deploy.outputs.resolver_url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import update_m3u

          playlist = Path("m3u.m3u")
          lines = playlist.read_text(encoding="utf-8-sig").splitlines()
          if update_m3u.pin_cloud_resolver_channels(lines):
              playlist.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY
          if grep -R "192\.168\.0\.165\|127\.0\.0\.1\|8787" m3u.m3u; then
            echo "La M3U conserva una direccion local" >&2
            exit 1
          fi

      - name: Publicar URL Cloudflare en la rama principal
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VibeM3U Cloudflare Deploy"
          git config user.email "m3u-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- m3u.m3u)" ]; then
            echo "La M3U ya usa el resolutor cloud."
            exit 0
          fi
          git add m3u.m3u
          git commit -m "Conecta resolutor Chile de Cloudflare [skip ci]"
          git push origin HEAD:main
